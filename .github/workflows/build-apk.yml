name: Build APK 455
on:
  workflow_dispatch:
  push:
    branches:
      - feature/visao-inteligente-offline
      - integracao-tradutor-nativo
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: aurora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Rust e alvos Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'
      - name: Instalar Android NDK 28
        run: yes | sdkmanager --licenses && sdkmanager --install "ndk;28.0.13004108"
      - name: Compilar motor SLIMT nativo
        working-directory: app/src/main/rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          export CMAKE_GENERATOR=Ninja
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export ANDROID_PLATFORM=android-24
          ANDROID_ABI=arm64-v8a cargo ndk -t arm64-v8a --platform 24 --link-libcxx-shared -o ../jniLibs build --release
          ANDROID_ABI=armeabi-v7a cargo ndk -t armeabi-v7a --platform 24 --link-libcxx-shared -o ../jniLibs build --release
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-455-slimt-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
