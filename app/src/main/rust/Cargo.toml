[package]
name = "aurora-translator"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
translator = { git = "https://github.com/DavidVentura/translator-rs.git", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
